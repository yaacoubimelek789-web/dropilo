version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dropilo-app:latest
    container_name: dropilo_app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      - DB_PROFILE=local
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=dropilo_db
      - DB_USER=dropilo_user
      - DB_PASS=dropilo_pass
      - APP_DEBUG=1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: dropilo_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=dropilo_db
      - MYSQL_USER=dropilo_user
      - MYSQL_PASSWORD=dropilo_pass
      - MYSQL_ROOT_PASSWORD=dropilo_root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ../../../u631627980_dropilo.20260616183319.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdropilo_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db_data:
